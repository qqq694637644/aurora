name: Aurora Protocol Validation Build

on:
  push:
    branches:
      - gpt/aurora-protocol-validation-plan
    paths:
      - .github/workflows/protocol-validation-build.yml
      - internal/chatgpt/protocol_local_ws_integration_test.go
      - internal/accounts/protocol_local_ws_reconnect_test.go
      - internal/accounts/wss_actor.go

permissions:
  contents: read

jobs:
  compile-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build Windows x64 executable
        shell: pwsh
        env:
          CGO_ENABLED: '0'
          GOOS: windows
          GOARCH: amd64
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          go build -trimpath -o dist/aurora.exe .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-FileHash dist/aurora.exe -Algorithm SHA256 | Format-Table -AutoSize
      - name: Build test executables for Python-driven local protocol checks
        shell: pwsh
        env:
          CGO_ENABLED: '0'
        run: |
          go test -c -o dist/aurora-chatgpt-protocol-tests.exe ./internal/chatgpt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test -c -o dist/aurora-accounts-protocol-tests.exe ./internal/accounts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test -c -o dist/aurora-handler-protocol-tests.exe ./internal/handler
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test -c -o dist/aurora-toolcall-protocol-tests.exe ./internal/toolcall
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test -c -o dist/aurora-imageflow-protocol-tests.exe ./internal/imageflow
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test -c -o dist/aurora-audioflow-protocol-tests.exe ./internal/audioflow
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload binary for local Python contract tests
        uses: actions/upload-artifact@v4
        with:
          name: aurora-protocol-windows-amd64
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 3

  local-contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run selected protocol unit tests
        env:
          CGO_ENABLED: '0'
        run: |
          go test -count=1 ./internal/sseparser ./internal/httpstream ./internal/toolcall ./internal/accounts ./internal/chatgpt ./internal/handler ./internal/imageflow ./internal/audioflow
      - name: Race detector for local WebSocket lifecycle
        env:
          CGO_ENABLED: '1'
        run: |
          go test -race -count=1 -run '^TestProtocolLocal' ./internal/accounts ./internal/chatgpt
